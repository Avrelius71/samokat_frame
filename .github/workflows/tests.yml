name: Python autotests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Choose tests to run'
        required: false
        type: choice
        default: 'all'
        options:
          - smoke
          - regression
          - all

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests

    env:
      TEST_TARGET: ${{ github.event.inputs.deployment_target || 'all' }}

    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.27.0
          curl -Lo /tmp/allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          sudo tar -xzf /tmp/allure.tgz -C /opt/
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run smoke tests
        if: env.TEST_TARGET == 'smoke'
        run: pytest -m smoke --alluredir=./allure-results

      - name: Run regression tests
        if: env.TEST_TARGET == 'regression'
        run: pytest -m regression --alluredir=./allure-results

      - name: Run all tests
        if: env.TEST_TARGET == 'all'
        run: pytest --alluredir=./allure-results

      - name: Debug allure results (Проверка наличия файлов)
        if: always()
        run: |
          echo "Содержимое папки allure-results:"
          ls -la ./allure-results || echo "ПАПКА ПУСТАЯ ИЛИ ОТСУТСТВУЕТ!"
          echo "Количество JSON файлов результатов:"
          find ./allure-results -name "*.json" | wc -l

      - name: Generate report
        if: always()
        run: allure generate ./allure-results -c -o _site

      - name: Save allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: _site
          retention-days: 5

  publish-report:
    name: Report publication
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: _site

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to summary
        if: always()
        run: |
          {
            echo "## Allure Report"
            echo ""
            echo "📊 [Открыть отчёт](${{ steps.deployment.outputs.page_url }})"
            echo ""
            echo "Архив с отчётом также доступен в артефакте **allure-report**."
          } >> "$GITHUB_STEP_SUMMARY"